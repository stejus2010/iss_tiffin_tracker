<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tiffin Tracker — Indian School Sohar</title>
    <meta
      name="description"
      content="A calm nutrition companion for Indian School Sohar students: log your tiffin, see its nutrition and learn how to balance your meal."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="app-shell">
      <!-- ============ APP HEADER ============ -->
      <header class="app-header">
        <div class="app-header__text">
          <p class="greeting" id="greeting">Good Morning,</p>
          <h1 class="student-name"><span id="student-name">Student</span> <span aria-hidden="true">👋</span></h1>
          <p class="tagline">Short break tiffin check · 10:30–10:50 AM</p>
          <p class="school-tag">Indian School Sohar</p>
        </div>
        <button class="icon-button" id="notif-btn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 0 1-3.4 0"
            />
          </svg>
        </button>
      </header>

      <!-- ============ SCREENS ============ -->
      <main id="main" class="screens">
        <section id="screen-home" class="screen" data-screen="home" tabindex="-1"></section>
        <section id="screen-insights" class="screen" data-screen="insights" hidden tabindex="-1"></section>
        <section id="screen-profile" class="screen" data-screen="profile" hidden tabindex="-1"></section>
      </main>

      <!-- ============ BOTTOM NAVIGATION ============ -->
      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-item is-active" type="button" data-nav="home" aria-current="page">
          <span class="nav-icon" aria-hidden="true">🏠</span><span class="nav-label">Home</span>
        </button>
        <button class="nav-item" type="button" data-action="reset-data">
          <span class="nav-icon" aria-hidden="true">🔄</span><span class="nav-label">New student</span>
        </button>
        <button class="nav-fab" type="button" data-action="open-picker" aria-label="Add food item">
          <span aria-hidden="true">+</span>
        </button>
        <button class="nav-item" type="button" data-nav="insights">
          <span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">Insights</span>
        </button>
        <button class="nav-item" type="button" data-nav="profile">
          <span class="nav-icon" aria-hidden="true">🙂</span><span class="nav-label">Profile</span>
        </button>
      </nav>
    </div>

    <!-- ============ MODAL LAYER ============ -->
    <div class="modal-layer" id="modal-layer" hidden>
      <div class="modal-backdrop" data-action="close-modal"></div>
      <div
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      ></div>
    </div>

    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
